  <text class="box-title" x="632" y="222">Customer Clean</text>
  <text class="small" x="632" y="249">Dedup latest customer</text>
  <text class="small" x="632" y="271">Gender/status mapping</text>
  <text class="small" x="632" y="293">Email, DOB, credit score validation</text>

