  <text class="small" x="947" y="976">FK orphan checks</text>
  <text class="small" x="947" y="998">SCD2 timeline checks</text>

  <!-- Business Logic -->
  <rect class="logic" x="1220" y="185" width="240" height="128" rx="10"/>
  <text class="box-title" x="1242" y="212">Credit Utilization</text>
  <text class="small" x="1242" y="240">closing_balance / credit_limit</text>
  <text class="small" x="1242" y="262">Buckets: LOW, MODERATE,</text>
  <text class="small" x="1242" y="284">HIGH, CRITICAL, OVER_LIMIT</text>
  <text class="note" x="1242" y="304">Risk signal: utilization >= 70%</text>

  <rect class="logic" x="1220" y="340" width="240" height="142" rx="10"/>
  <text class="box-title" x="1242" y="367">Payment Behavior</text>
  <text class="small" x="1242" y="395">payment_ratio = payments / balance</text>
  <text class="small" x="1242" y="417">Classes: FULL, PARTIAL,</text>
  <text class="small" x="1242" y="439">MIN_ONLY, NO_PAYMENT</text>
  <text class="small" x="1242" y="461">Late payment %, streaks</text>

  <rect class="logic" x="1220" y="510" width="240" height="150" rx="10"/>
  <text class="box-title" x="1242" y="537">Default and Recovery</text>
  <text class="small" x="1242" y="565">DPD buckets: 1-30, 31-60,</text>
  <text class="small" x="1242" y="587">61-90, 90+</text>
  <text class="small" x="1242" y="609">Repeat default from LAG()</text>
  <text class="small" x="1242" y="631">recovery_rate = recovered /</text>
  <text class="small" x="1242" y="653">outstanding amount</text>

  <rect class="logic" x="1220" y="690" width="240" height="160" rx="10"/>
  <text class="box-title" x="1242" y="717">Composite Risk Score</text>
  <text class="small" x="1242" y="745">credit score factor</text>
  <text class="small" x="1242" y="767">+ utilization factor</text>
  <text class="small" x="1242" y="789">+ delinquency score</text>
  <text class="small" x="1242" y="811">+ default count</text>
  <text class="small" x="1242" y="833">+ income factor</text>

  <rect class="logic" x="1220" y="880" width="240" height="155" rx="10"/>
  <text class="box-title" x="1242" y="907">Customer Segmentation</text>
  <text class="small" x="1242" y="935">RFM = recency + frequency</text>
  <text class="small" x="1242" y="957">+ monetary score</text>
  <text class="small" x="1242" y="979">Overlay with risk tier</text>
  <text class="small" x="1242" y="1001">Segments: CHAMPIONS,</text>
  <text class="small" x="1242" y="1023">AT_RISK, DEFAULT_PRONE</text>

  <rect class="logic" x="1220" y="1065" width="240" height="80" rx="10"/>
  <text class="box-title" x="1242" y="1092">Monthly Trends</text>
  <text class="small" x="1242" y="1120">MTD, QTD, YTD, MoM,</text>
  <text class="small" x="1242" y="1142">3-month rolling averages</text>

