  <text class="text" x="88" y="384">card_status.parquet</text>

  <rect class="source" x="70" y="425" width="200" height="78" rx="10"/>
  <text class="box-title" x="88" y="452">Transactions</text>
  <text class="text" x="88" y="477">transactions.json</text>

  <rect class="source" x="70" y="528" width="200" height="90" rx="10"/>
  <text class="box-title" x="88" y="555">Billing</text>
  <text class="text" x="88" y="580">billing_statements.csv</text>
  <text class="text" x="88" y="602">billing_payments.csv</text>

  <rect class="source" x="70" y="643" width="200" height="90" rx="10"/>
  <text class="box-title" x="88" y="670">Collections</text>
