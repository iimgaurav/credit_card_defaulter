  <rect class="bg" x="0" y="0" width="1900" height="1320"/>

  <text class="title" x="55" y="55">End-to-End Data Lineage and Business Logic</text>
  <text class="subtitle" x="55" y="87">Credit Card Defaulter Analysis: source files to Bronze, Silver transformations, Gold star schema, analytics KPIs, and Power BI consumption.</text>

