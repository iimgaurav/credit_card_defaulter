  <text class="box-title" x="947" y="232">Dimensions</text>
  <text class="small" x="947" y="260">dim_date</text>
  <text class="small" x="947" y="282">dim_geography</text>
  <text class="small" x="947" y="304">Type 1/static reference model</text>

