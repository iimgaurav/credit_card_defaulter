  <text class="box-title" x="632" y="352">Card Clean</text>
  <text class="small" x="632" y="379">Latest card status</text>
  <text class="small" x="632" y="401">Card type/network standardization</text>
  <text class="small" x="632" y="423">Credit limit and rate validation</text>

  <rect class="silver" x="610" y="455" width="240" height="105" rx="10"/>
  <text class="box-title" x="632" y="482">Transaction Clean</text>
