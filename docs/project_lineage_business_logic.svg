  <text class="box-title" x="80" y="1228">How to explain this diagram in interview</text>
  <text class="text" x="80" y="1256">Raw synthetic banking files land in a Unity Catalog Volume, Bronze captures raw Delta tables with audit metadata, Silver applies cleaning and validation, Gold creates SCD2 dimensions and facts, then analytics notebooks calculate utilization, payment behavior, default risk, recovery, segmentation, and trends for Power BI and monitoring.</text>
