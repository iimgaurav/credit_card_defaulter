  <text class="small" x="632" y="661">payment_due_flag</text>
  <text class="small" x="632" y="683">utilization_ratio, payment_ratio</text>

  <rect class="silver" x="610" y="715" width="240" height="115" rx="10"/>
  <text class="box-title" x="632" y="742">Default and Recovery Clean</text>
  <text class="small" x="632" y="769">Validate DPD and outstanding</text>
  <text class="small" x="632" y="791">LAG/LEAD repeat default logic</text>
  <text class="small" x="632" y="813">Recovery method/status mapping</text>

  <rect class="silver" x="610" y="855" width="240" height="115" rx="10"/>
  <text class="box-title" x="632" y="882">Customer 360</text>
  <text class="small" x="632" y="909">Aggregate cards, spend, billing</text>
  <text class="small" x="632" y="931">defaults, balances, last txn</text>
  <text class="small" x="632" y="953">Simple LOW/MEDIUM/HIGH risk band</text>

