  <text class="text" x="88" y="832">currency.csv</text>
  <text class="text" x="88" y="854">dim_calendar.csv</text>

  <rect class="logic" x="70" y="930" width="200" height="140" rx="10"/>
  <text class="box-title" x="88" y="957">Source Reality</text>
  <text class="small" x="88" y="985">Implemented source is</text>
  <text class="small" x="88" y="1005">synthetic file generation.</text>
  <text class="small" x="88" y="1033">No PostgreSQL, SQL Server,</text>
  <text class="small" x="88" y="1053">CRM API, or ERP connector</text>
  <text class="small" x="88" y="1073">was found in the repo.</text>

