name: CE Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  DATABRICKS_CLI_VERSION: "0.215.0"
  PYTHON_VERSION: "3.11"

jobs:
  lint-and-test:
    name: Lint and Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install flake8 pytest pyspark>=3.5.0 pandas>=2.0.0

      - name: Databricks notebook syntax check
        run: |
          errors=0
          for f in $(find notebooks -name '*.py' -type f); do
            python -c "import re,sys;code=re.sub(r'# MAGIC.*|# COMMAND .*|# %run.*|%sql.*','',open(sys.argv[1]).read());compile(code,sys.argv[1],'exec')" "$f" 2>&1 || { echo "::error::Syntax error in $f"; errors=$((errors+1)); }
          done
          if [ $errors -gt 0 ]; then exit 1; fi
          echo "All notebooks passed syntax check."

      - name: Run flake8 lint
        run: |
          flake8 notebooks/ src/ tests/ --max-line-length=120 --ignore=E402,W503 --exclude=__pycache__ --show-source --statistics || true

      - name: Run unit tests (local PySpark)
        run: |
          pytest tests/unit/ -v --tb=short

  validate-and-deploy:
    name: Validate and Deploy Bundle
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main
        with:
          version: ${{ env.DATABRICKS_CLI_VERSION }}


      - name: Validate bundle (CE target)
        run: |
          databricks bundle validate --target ce
        env:
          DATABRICKS_HOST: ${{ vars.CE_DATABRICKS_HOST || 'https://community.cloud.databricks.com' }}
          DATABRICKS_TOKEN: ${{ secrets.CE_DATABRICKS_TOKEN }}

      - name: Deploy to CE workspace
        if: github.ref == 'refs/heads/main'
        run: |
          databricks bundle deploy --target ce --auto-approve
        env:
          DATABRICKS_HOST: ${{ secrets.CE_DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.CE_DATABRICKS_TOKEN }}
